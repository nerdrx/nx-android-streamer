apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'dev.nerdrx.nxbridge'
    compileSdk 35

    defaultConfig {
        // nx_bridge.py keys its `pm path` check and its fallback spool directory
        // on exactly this id. Changing it here means changing BRIDGE_PACKAGE there.
        applicationId "dev.nerdrx.nxbridge"
        // minSdk 29 mirrors the client. The container is Android 13 (API 33).
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    // Debug-signed release, same shim as the client: no upload keystore exists
    // yet and `adb install` does not care.
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Deliberately tiny. This app has no network, no WebRTC, no UI framework:
    // it writes a json file, waits for a file to appear, and returns a Uri.
    // FileProvider is the one thing it genuinely needs from AndroidX.
    implementation 'androidx.core:core-ktx:1.13.1'
}
