// Toolchain pinned identical to nx-flick (a known-good project on this machine):
// AGP 8.9.1, Kotlin 2.0.21, Gradle 8.13 (see gradle/wrapper).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
