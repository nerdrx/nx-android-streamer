<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NX Android Streamer">
  <!-- Maskable: full-bleed void so any mask shape crops cleanly, with all the
       glyph inside the inner 80% safe zone (r <= 205 from centre 256,256). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7700ff" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#7700ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7700ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a45cff"/>
      <stop offset="45%"  stop-color="#7700ff"/>
      <stop offset="100%" stop-color="#4a00a8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0a0a12"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- the orb -->
  <circle cx="256" cy="256" r="116" fill="url(#orb)"/>
  <ellipse cx="222" cy="212" rx="72" ry="52" fill="url(#sheen)" transform="rotate(-28 222 212)"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="#c79bff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- glass: the phone the stream lands on -->
  <rect x="228" y="200" width="56" height="112" rx="12"
        fill="#0a0a12" fill-opacity="0.55"
        stroke="#e8e6f2" stroke-opacity="0.85" stroke-width="7"/>
  <line x1="246" y1="296" x2="266" y2="296"
        stroke="#e8e6f2" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
</svg>
